<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="storelly_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg_grad)" />
  
  <!-- Subtle Border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Glow Accent -->
  <circle cx="256" cy="256" r="140" fill="#10b981" fill-opacity="0.08" />

  <!-- Storelly Icon Mark: Store Canopy & Modern Commerce Grid -->
  <g filter="url(#glow)" transform="translate(106, 116)">
    <!-- Store Canopy Top -->
    <path d="M150 18 L278 84 C286 88 288 98 284 106 L270 134 C266 142 256 146 248 142 L150 92 L52 142 C44 146 34 142 30 134 L16 106 C12 98 14 88 22 84 Z" fill="url(#storelly_grad)" />
    
    <!-- Front Pillars & Base -->
    <path d="M44 150 L84 150 L84 250 L44 250 Z" fill="#ffffff" fill-opacity="0.9" rx="6" />
    <path d="M130 150 L170 150 L170 250 L130 250 Z" fill="#ffffff" fill-opacity="0.9" rx="6" />
    <path d="M216 150 L256 150 L256 250 L216 250 Z" fill="#ffffff" fill-opacity="0.9" rx="6" />
    
    <!-- Floor Foundation -->
    <rect x="24" y="254" width="252" height="24" rx="8" fill="url(#storelly_grad)" />

    <!-- Sparkle Accent on Top Right -->
    <path d="M250 20 L256 36 L272 42 L256 48 L250 64 L244 48 L228 42 L244 36 Z" fill="#34d399" />
  </g>
</svg>
